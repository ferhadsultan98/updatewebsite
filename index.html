    <style>
        :root {
            --primary-color: #f59e0b;
            --secondary-color: #d97706;
            --text-color: #374151;
            --text-light-color: #6b7280;
            --bg-color: #f9fafb;
            --card-bg-color: #ffffff;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        .darkMode {
            --primary-color: #fbbf24;
            --secondary-color: #f59e0b;
            --text-color: #e5e7eb;
            --text-light-color: #9ca3af;
            --bg-color: #1f2937;
            --card-bg-color: #111827;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: var(--transition);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            position: relative;
        }

        .logo {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 18px;
            color: var(--text-light-color);
            margin-bottom: 30px;
        }

        .themeToggle {
            position: absolute;
            top: 40px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }

        .themeToggle:hover {
            color: var(--primary-color);
            transform: rotate(30deg);
        }

        .searchContainer {
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .searchInput {
            padding: 12px 20px;
            border: 2px solid var(--text-light-color);
            border-radius: 50px;
            font-size: 16px;
            width: 100%;
            background-color: var(--card-bg-color);
            color: var(--text-color);
            transition: var(--transition);
        }

        .searchInput:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
        }

        .categoriesContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .categoryBtn {
            padding: 8px 20px;
            background-color: var(--card-bg-color);
            color: var(--text-color);
            border: 1px solid var(--text-light-color);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .categoryBtn:hover, .categoryBtn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .menuContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .menuSection {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
            width: 100%;
        }

        .menuSection.active {
            display: grid;
        }

        .sectionTitle {
            font-size: 28px;
            margin-bottom: 20px;
            color: var(--primary-color);
            grid-column: 1 / -1;
            position: relative;
            padding-bottom: 10px;
        }

        .sectionTitle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            background-color: var(--primary-color);
        }

        .menuItem {
            background-color: var(--card-bg-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .menuItem:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .menuItemImg {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .menuItemContent {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .menuItemTitle {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .menuItemDesc {
            font-size: 14px;
            color: var(--text-light-color);
            margin-bottom: 15px;
            line-height: 1.5;
            flex-grow: 1;
        }

        .menuItemFooter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .menuItemPrice {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .menuItemRating {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .star {
            color: #fbbf24;
        }

        .emptyResult {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: var(--text-light-color);
            background-color: var(--card-bg-color);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            display: none;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            margin-top: 60px;
            border-top: 1px solid var(--text-light-color);
            color: var(--text-light-color);
        }

        @media (max-width: 768px) {
            .menuContainer {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .menuSection {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .logo {
                font-size: 28px;
            }

            .tagline {
                font-size: 16px;
            }

            .searchInput {
                padding: 10px 16px;
            }

            .themeToggle {
                top: 30px;
                right: 10px;
            }
        }

        @media (max-width: 480px) {
            .menuContainer {
                grid-template-columns: 1fr;
            }

            .menuSection {
                grid-template-columns: 1fr;
            }

            .categoryBtn {
                padding: 6px 16px;
                font-size: 12px;
            }

            .themeToggle {
                top: 20px;
                right: 10px;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menuItem {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Scroll Top Button */
        .scrollTopBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--primary-color);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 99;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .scrollTopBtn.visible {
            opacity: 1;
            visibility: visible;
        }

        .scrollTopBtn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-5px);
        }

        @media (max-width: 768px) {
            .scrollTopBtn {
                width: 40px;
                height: 40px;
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>

                    rating: 4.9,
                    image: '/api/placeholder/400/300',
                    category: 'specialties'
                },
                {
                    id: 'spec5',
                    name: 'Seafood Paella',
                    description: 'Spanish rice dish with assorted seafood, saffron, and chorizo',
                    price: 38.95,
                    rating: 4.8,
                    image: '/api/placeholder/400/300',
                    category: 'specialties'
                }
            ]
        };

        // DOM Elements
        const menuContainer = document.getElementById('menuContainer');
        const searchInput = document.getElementById('searchInput');
        const categoryBtns = document.querySelectorAll('.categoryBtn');
        const emptyResult = document.getElementById('emptyResult');
        const themeToggle = document.getElementById('themeToggle');
        const scrollTopBtn = document.getElementById('scrollTopBtn');

        // Initialize Menu
        function initMenu() {
            // Create menu sections
            for (const category in menuData) {
                createMenuSection(category, menuData[category]);
            }
            
            // Show all menu items initially
            filterMenuByCategory('all');
        }

        // Create menu section
        function createMenuSection(category, items) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'menuSection';
            sectionDiv.id = `section-${category}`;
            sectionDiv.dataset.category = category;
            
            const sectionTitle = document.createElement('h2');
            sectionTitle.className = 'sectionTitle';
            sectionTitle.textContent = category.charAt(0).toUpperCase() + category.slice(1);
            sectionDiv.appendChild(sectionTitle);
            
            // Create menu items
            items.forEach(item => {
                const menuItemDiv = createMenuItem(item);
                sectionDiv.appendChild(menuItemDiv);
            });
            
            menuContainer.appendChild(sectionDiv);
        }

        // Create menu item
        function createMenuItem(item) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'menuItem';
            itemDiv.dataset.aos = 'fade-up';
            itemDiv.dataset.category = item.category;
            
            const html = `
                <img src="${item.image}" alt="${item.name}" class="menuItemImg">
                <div class="menuItemContent">
                    <h3 class="menuItemTitle">${item.name}</h3>
                    <p class="menuItemDesc">${item.description}</p>
                    <div class="menuItemFooter">
                        <div class="menuItemPrice">$${item.price.toFixed(2)}</div>
                        <div class="menuItemRating">
                            ${getRatingStars(item.rating)}
                            <span>${item.rating.toFixed(1)}</span>
                        </div>
                    </div>
                </div>
            `;
            
            itemDiv.innerHTML = html;
            return itemDiv;
        }

        // Get rating stars
        function getRatingStars(rating) {
            let stars = '';
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            
            for (let i = 0; i < fullStars; i++) {
                stars += '<i class="fas fa-star star"></i>';
            }
            
            if (hasHalfStar) {
                stars += '<i class="fas fa-star-half-alt star"></i>';
            }
            
            return stars;
        }

        // Filter menu by category
        function filterMenuByCategory(category) {
            const sections = document.querySelectorAll('.menuSection');
            
            if (category === 'all') {
                sections.forEach(section => {
                    section.classList.add('active');
                });
            } else {
                sections.forEach(section => {
                    if (section.dataset.category === category) {
                        section.classList.add('active');
                    } else {
                        section.classList.remove('active');
                    }
                });
            }
            
            // Update active button
            categoryBtns.forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Search functionality
        function searchMenu(query) {
            query = query.toLowerCase().trim();
            
            if (query === '') {
                // Reset to showing all items
                filterMenuByCategory(document.querySelector('.categoryBtn.active').dataset.category);
                emptyResult.style.display = 'none';
                return;
            }
            
            let foundItems = false;
            
            // Hide all sections first
            document.querySelectorAll('.menuSection').forEach(section => {
                section.classList.remove('active');
            });
            
            // Search through all items
            for (const category in menuData) {
                const items = menuData[category];
                const section = document.getElementById(`section-${category}`);
                
                if (!section) continue;
                
                let sectionHasMatch = false;
                
                // Get all item elements in this section (excluding the title)
                const itemElements = section.querySelectorAll('.menuItem');
                
                items.forEach((item, index) => {
                    const itemElement = itemElements[index];
                    
                    if (!itemElement) return;
                    
                    // Check if item matches search query
                    const matchesName = item.name.toLowerCase().includes(query);
                    const matchesDesc = item.description.toLowerCase().includes(query);
                    
                    if (matchesName || matchesDesc) {
                        itemElement.style.display = 'flex';
                        sectionHasMatch = true;
                        foundItems = true;
                    } else {
                        itemElement.style.display = 'none';
                    }
                });
                
                // Show section if it has matching items
                if (sectionHasMatch) {
                    section.classList.add('active');
                }
            }
            
            // Show/hide empty result message
            emptyResult.style.display = foundItems ? 'none' : 'block';
        }

        // Toggle dark/light theme
        function toggleTheme() {
            const body = document.body;
            const icon = themeToggle.querySelector('i');
            
            body.classList.toggle('darkMode');
            
            if (body.classList.contains('darkMode')) {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }

        // Scroll to top functionality
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // Check scroll position for scroll to top button
        function checkScrollPosition() {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
        }

        // Event Listeners
        searchInput.addEventListener('input', () => {
            searchMenu(searchInput.value);
        });

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const category = btn.dataset.category;
                filterMenuByCategory(category);
                searchInput.value = ''; // Clear search when changing category
            });
        });

        themeToggle.addEventListener('click', toggleTheme);
        scrollTopBtn.addEventListener('click', scrollToTop);
        window.addEventListener('scroll', checkScrollPosition);

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            initMenu();
            checkScrollPosition();
        });
    </script>
</body>
</html>
